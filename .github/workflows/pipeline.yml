name: GitPulse Daily Pipeline

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: gitpulse-daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.TOKEN_PAT }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSLMODE: require

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate code compiles
        run: python -m compileall .

      - name: Run tests
        run: pytest

      - name: Set run date
        run: echo "GITPULSE_RUN_DATE=$(date -u +%F)" >> $GITHUB_ENV

      - name: Run pipeline
        run: python -m pipeline.runner

      - name: Calculate impact scores
        run: python -m analysis.impact_score
