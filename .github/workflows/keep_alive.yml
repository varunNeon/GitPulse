name: Keep Streamlit Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: gitpulse-keep-streamlit-alive
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STREAMLIT_APP_URL: https://gitpulse-64rqmapppv4wwlu8qpghuam.streamlit.app/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Wake Streamlit app
        run: python scripts/keep_streamlit_alive.py
