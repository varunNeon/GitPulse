name: Keep Streamlit Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: gitpulse-keep-streamlit-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --output /dev/null \
            --write-out "Streamlit responded with HTTP %{http_code}\n" \
            "https://gitpulse-64rqmapppv4wwlu8qpghuam.streamlit.app/?embed=true"
