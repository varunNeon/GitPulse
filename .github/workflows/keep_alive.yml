name: Keep Streamlit Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: gitpulse-keep-streamlit-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app
        run: curl --fail --silent --show-error --location https://gitpulse-64rqmapppv4wwlu8qpghuam.streamlit.app > /dev/null
